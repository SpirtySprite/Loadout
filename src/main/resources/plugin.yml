name: Loadout
version: '${project.version}'
main: com.kirugoldzzzz.loadout.Loadout
api-version: '1.21'
folia-supported: true
author: KiruGoldzZz
description: "Kits with progression, ceremonies and an in-game editor for Paper and Folia"
softdepend: [PlaceholderAPI, Vault]
commands:
  kit:
    description: Claim, preview, gift and manage kits
    usage: /kit [name|preview|gift|admin]
    aliases: [kits]
permissions:
  loadout.kit.use:
    description: Use /kit, open the menu and claim kits
    default: true
  loadout.kit.gift:
    description: Gift a kit to another player
    default: true
  loadout.admin.kits:
    description: Create, edit, give and reset kits
    default: op
    children:
      loadout.kit.use: true
  loadout.kit.bypass:
    description: Bypass kit cooldowns, prices, conditions and permissions
    default: false
    children:
      loadout.kit.bypass.cooldown: true
      loadout.kit.bypass.cost: true
      loadout.kit.bypass.requirements: true
      loadout.kit.bypass.permission: true
  loadout.kit.bypass.cooldown:
    description: Bypass kit cooldowns and resets
    default: false
  loadout.kit.bypass.cost:
    description: Claim paid kits without paying
    default: false
  loadout.kit.bypass.requirements:
    description: Bypass kit conditions
    default: false
  loadout.kit.bypass.permission:
    description: Access reserved kits
    default: false
  loadout.kit.vip:
    description: Access to the example VIP kit
    default: false
  loadout.kit.legend:
    description: Access to the example Legend kit
    default: false
  loadout.kit.legende:
    description: Access to the example French Legende kit
    default: false
  loadout.alerts.kits:
    description: Alerts for unsaved kit configuration
    default: op
