settings:
  timezone: Europe/Paris
  show-locked: true
  reminders: true
  join-summary: true
  animation: true
  broadcasts: true
  protected-lore: "<#6E7681>⛓ Kit item, cannot be sold"
  first-join-delay-ticks: 60
  claim-spacing-millis: 750
  voucher:
    material: PAPER
    name: "<#A78BFA><b>Kit voucher</b> <#6E7681>▸</#6E7681> <kit>"
    lore:
      - "<#6E7681>[ᴋɪᴛ ᴠᴏᴜᴄʜᴇʀ]"
      - ""
      - "<#C9D1D9>This voucher holds the kit <kit><#C9D1D9>."
      - "<#C9D1D9>It can be kept, traded and gifted."
      - ""
      - "<#FBBF24>ᐅ <b>ʀɪɢʜᴛ ᴄʟɪᴄᴋ</b> <#C9D1D9>to open it"

progression:
  mastery:
    bronze:
      name: "Bronze"
      claims: 5
      cooldown-reduction: 5
      bonus: 10
      upgrade:
        money: 2500
    silver:
      name: "Silver"
      claims: 15
      cooldown-reduction: 10
      bonus: 20
      upgrade:
        money: 7500
    gold:
      name: "Gold"
      claims: 35
      cooldown-reduction: 15
      bonus: 35
      extra-rolls: 1
      upgrade:
        money: 20000
    diamond:
      name: "Diamond"
      claims: 70
      cooldown-reduction: 20
      bonus: 50
      extra-rolls: 1
      items:
        apple:
          material: GOLDEN_APPLE
          amount: 2
    netherite:
      name: "Netherite"
      claims: 150
      cooldown-reduction: 30
      bonus: 75
      extra-rolls: 2
      items:
        apples:
          material: ENCHANTED_GOLDEN_APPLE
        bottles:
          material: EXPERIENCE_BOTTLE
          amount: 16
  streaks:
    enabled: true
    bonus-per-claim: 5
    maximum-bonus: 50
    warning: 3h
    milestones:
      '3':
        money: 500
        lines:
          - "500 for 3 days in a row"
      '7':
        money: 2500
        levels: 5
      '14':
        money: 7500
        shards: 25
      '30':
        money: 25000
        shards: 100
        levels: 20
  collection:
    '3':
      money: 1000
    '6':
      money: 5000
      levels: 10
    '10':
      money: 15000
      shards: 50
  featured:
    enabled: true
    discount: 30
    rotation: "00:00"
    kits: []

categories:
  starter:
    name: "<#4ADE80><b>Starter</b>"
    icon: WOODEN_SWORD
    order: 1
    description:
      - "Everything to start the adventure right."
  rewards:
    name: "<#FBBF24><b>Rewards</b>"
    icon: CLOCK
    order: 2
    description:
      - "Kits that come back every"
      - "day and every week."
  ranks:
    name: "<#A78BFA><b>Ranks</b>"
    icon: DIAMOND
    order: 3
    description:
      - "Kits reserved for ranks."
  events:
    name: "<#F87171><b>Events</b>"
    icon: CAKE
    order: 4
    description:
      - "Only available during"
      - "server events."

kits:
  first-steps:
    name: "<gradient:#4ADE80:#22D3EE><b>First Steps</b></gradient>"
    description:
      - "Given on your very first"
      - "join to the server."
    icon:
      material: OAK_SAPLING
    category: starter
    order: 1
    max-uses: 1
    options:
      first-join: true
      protect-items: true
    contents:
      '0':
        material: STONE_SWORD
      '1':
        material: STONE_PICKAXE
      '2':
        material: STONE_AXE
      '3':
        material: BREAD
        amount: 16
      '4':
        material: TORCH
        amount: 32
      '39':
        material: LEATHER_HELMET
      '38':
        material: LEATHER_CHESTPLATE
      '37':
        material: LEATHER_LEGGINGS
      '36':
        material: LEATHER_BOOTS
    rewards:
      money: 100

  beginner:
    name: "<gradient:#4ADE80:#A3E635><b>Beginner</b></gradient>"
    description:
      - "Tools and food"
      - "to survive the first nights."
    icon:
      material: STONE_PICKAXE
    category: starter
    order: 2
    cooldown: 12h
    options:
      protect-items: true
    contents:
      '0':
        material: STONE_SWORD
      '1':
        material: STONE_PICKAXE
      '2':
        material: COOKED_BEEF
        amount: 12
      '3':
        material: TORCH
        amount: 16

  respawn:
    name: "<gradient:#94A3B8:#C9D1D9><b>Respawn</b></gradient>"
    animation-level: auto
    description:
      - "Given back automatically after"
      - "a death, to get back on your feet."
    icon:
      material: TOTEM_OF_UNDYING
    category: starter
    order: 3
    cooldown: 10m
    options:
      respawn: true
      protect-items: true
      animation: false
    contents:
      '0':
        material: WOODEN_SWORD
      '1':
        material: BREAD
        amount: 6

  daily:
    name: "<gradient:#FBBF24:#F59E0B><b>Daily</b></gradient>"
    description:
      - "Some money and a surprise"
      - "ore, every day at midnight."
    icon:
      material: SUNFLOWER
    category: rewards
    order: 1
    reset: daily
    reset-time: "00:00"
    pool:
      rolls: 1
      unique: true
      entries:
        iron:
          material: IRON_INGOT
          weight: 50
          min-amount: 4
          max-amount: 8
        gold:
          material: GOLD_INGOT
          weight: 30
          min-amount: 3
          max-amount: 6
        emerald:
          material: EMERALD
          weight: 15
          min-amount: 2
          max-amount: 4
        diamond:
          material: DIAMOND
          weight: 5
          min-amount: 1
          max-amount: 2
    rewards:
      money: 250
      lines:
        - "A randomly drawn ore"

  weekly:
    name: "<gradient:#F59E0B:#F87171><b>Weekly</b></gradient>"
    description:
      - "The big Monday chest for"
      - "regular players."
    icon:
      material: ENDER_CHEST
    category: rewards
    order: 2
    reset: weekly
    reset-day: monday
    reset-time: "00:00"
    requirements:
      playtime: 2h
    pool:
      rolls: 3
      unique: true
      entries:
        diamonds:
          material: DIAMOND
          weight: 20
          min-amount: 2
          max-amount: 5
        apples:
          material: GOLDEN_APPLE
          weight: 30
          min-amount: 1
          max-amount: 3
        bottles:
          material: EXPERIENCE_BOTTLE
          weight: 30
          min-amount: 8
          max-amount: 16
        anvil:
          material: ANVIL
          weight: 10
        book:
          material: ENCHANTED_BOOK
          weight: 10
        netherite:
          material: NETHERITE_SCRAP
          weight: 3
    rewards:
      money: 1000
      levels: 5
      lines:
        - "3 different randomly drawn items"

  adventurer:
    name: "<gradient:#22D3EE:#A78BFA><b>Adventurer</b></gradient>"
    description:
      - "The full gear to head out"
      - "and explore far from spawn."
    icon:
      material: COMPASS
    category: starter
    order: 4
    cooldown: 1d
    cost:
      money: 1500
    requirements:
      playtime: 1h
      kits:
        - beginner
    options:
      giftable: true
      voucher: true
    contents:
      '0':
        material: IRON_SWORD
        enchantments:
          - sharpness:1
      '1':
        material: IRON_PICKAXE
        enchantments:
          - efficiency:2
      '2':
        material: SHIELD
      '3':
        material: COOKED_PORKCHOP
        amount: 24
      '4':
        material: WATER_BUCKET
      '5':
        material: ENDER_PEARL
        amount: 4
      '38':
        material: IRON_CHESTPLATE
      '40':
        material: TORCH
        amount: 32

  vip:
    name: "<gradient:#A78BFA:#F0ABFC><b>VIP</b></gradient>"
    description:
      - "Enchanted iron armor and"
      - "resources for VIPs."
    hint:
      - "Unlocked with the VIP rank."
    icon:
      material: IRON_CHESTPLATE
    category: ranks
    order: 1
    permission: loadout.kit.vip
    cooldown: 2d
    options:
      protect-items: true
      announce: true
    contents:
      '0':
        material: IRON_SWORD
        enchantments:
          - sharpness:3
          - unbreaking:2
      '1':
        material: GOLDEN_APPLE
        amount: 4
      '39':
        material: IRON_HELMET
        enchantments:
          - protection:2
      '38':
        material: IRON_CHESTPLATE
        enchantments:
          - protection:2
      '37':
        material: IRON_LEGGINGS
        enchantments:
          - protection:2
      '36':
        material: IRON_BOOTS
        enchantments:
          - protection:2
    rewards:
      money: 2500

  legend:
    name: "<gradient:#FBBF24:#F87171><b>Legend</b></gradient>"
    animation-level: 4
    description:
      - "Diamond, apples and a"
      - "netherite draw for Legends."
    hint:
      - "Unlocked with the Legend rank."
    icon:
      material: NETHERITE_CHESTPLATE
    category: ranks
    order: 2
    permission: loadout.kit.legend
    cooldown: 3d
    options:
      protect-items: true
      announce: true
    contents:
      '0':
        material: DIAMOND_SWORD
        enchantments:
          - sharpness:4
          - unbreaking:3
      '1':
        material: DIAMOND_PICKAXE
        enchantments:
          - efficiency:4
          - unbreaking:3
      '2':
        material: ENCHANTED_GOLDEN_APPLE
      '39':
        material: DIAMOND_HELMET
        enchantments:
          - protection:3
      '38':
        material: DIAMOND_CHESTPLATE
        enchantments:
          - protection:3
      '37':
        material: DIAMOND_LEGGINGS
        enchantments:
          - protection:3
      '36':
        material: DIAMOND_BOOTS
        enchantments:
          - protection:3
    pool:
      rolls: 1
      entries:
        ingot:
          material: NETHERITE_INGOT
          weight: 10
        debris:
          material: ANCIENT_DEBRIS
          weight: 40
          min-amount: 2
          max-amount: 4
        diamond_blocks:
          material: DIAMOND_BLOCK
          weight: 50
    rewards:
      money: 5000
      effects:
        - strength:3m:1
        - regeneration:1m:1

  weekend:
    name: "<gradient:#22D3EE:#4ADE80><b>Weekend</b></gradient>"
    description:
      - "A boost to make the most"
      - "of Saturday and Sunday."
    icon:
      material: FIREWORK_ROCKET
    category: events
    order: 1
    reset: daily
    requirements:
      days:
        - saturday
        - sunday
    contents:
      '0':
        material: FIREWORK_ROCKET
        amount: 16
      '1':
        material: EXPERIENCE_BOTTLE
        amount: 16
    rewards:
      effects:
        - speed:5m:2
        - haste:5m:2

  christmas:
    name: "<gradient:#F87171:#4ADE80><b>Christmas</b></gradient>"
    description:
      - "The server's Christmas gift,"
      - "only once per player."
    icon:
      material: CAKE
    category: events
    order: 2
    max-uses: 1
    requirements:
      from: 24/12/2026 00:00
      until: 27/12/2026 00:00
    options:
      announce: true
    contents:
      '0':
        material: CAKE
      '1':
        material: DIAMOND
        amount: 5
      '2':
        material: FIREWORK_ROCKET
        amount: 32
    rewards:
      money: 2000

  mystery:
    name: "<gradient:#A78BFA:#F472B6><b>Mystery</b></gradient>"
    description:
      - "An animated roulette reveals three"
      - "randomly drawn items."
    icon:
      material: ENDER_EYE
    category: rewards
    order: 3
    cooldown: 8h
    cost:
      money: 750
    options:
      roulette: true
      giftable: true
    pool:
      rolls: 3
      unique: true
      entries:
        emeralds:
          material: EMERALD
          weight: 30
          min-amount: 4
          max-amount: 12
        diamonds:
          material: DIAMOND
          weight: 20
          min-amount: 1
          max-amount: 4
        pearls:
          material: ENDER_PEARL
          weight: 25
          min-amount: 4
          max-amount: 8
        totem:
          material: TOTEM_OF_UNDYING
          weight: 5
        trident:
          material: TRIDENT
          weight: 2
        elytra:
          material: ELYTRA
          weight: 1
        apples:
          material: GOLDEN_APPLE
          weight: 17
          min-amount: 2
          max-amount: 4

  team:
    name: "<gradient:#22D3EE:#4ADE80><b>Team</b></gradient>"
    description:
      - "A shared supply drop, only one"
      - "member claims it per day."
    icon:
      material: WHITE_BANNER
    category: rewards
    order: 4
    reset: daily
    options:
      team: true
    contents:
      '0':
        material: COOKED_BEEF
        amount: 32
      '1':
        material: IRON_INGOT
        amount: 16
      '2':
        material: ARROW
        amount: 64
    rewards:
      money: 500

  hunter:
    name: "<gradient:#F87171:#FBBF24><b>Hunter</b></gradient>"
    description:
      - "Reserved for players who proved"
      - "themselves against monsters."
    icon:
      material: BOW
    category: ranks
    order: 3
    cooldown: 1d
    requirements:
      statistics:
        - mob_kills:250
        - kill_entity:creeper:25
    contents:
      '0':
        material: BOW
        enchantments:
          - power:3
          - unbreaking:2
      '1':
        material: ARROW
        amount: 64
      '2':
        material: SPECTRAL_ARROW
        amount: 32

  assault:
    name: "<gradient:#F87171:#A78BFA><b>Assault</b></gradient>"
    description:
      - "Overpowered combat gear"
      - "that disappears after one hour."
    icon:
      material: NETHERITE_SWORD
    category: events
    order: 3
    cooldown: 12h
    item-lifetime: 1h
    options:
      protect-items: true
    contents:
      '0':
        material: NETHERITE_SWORD
        enchantments:
          - sharpness:5
      '39':
        material: NETHERITE_HELMET
        enchantments:
          - protection:4
      '38':
        material: NETHERITE_CHESTPLATE
        enchantments:
          - protection:4
      '37':
        material: NETHERITE_LEGGINGS
        enchantments:
          - protection:4
      '36':
        material: NETHERITE_BOOTS
        enchantments:
          - protection:4

crate-keys:
  command: "cle give {player} {crate} {amount}"
  crates: {}
